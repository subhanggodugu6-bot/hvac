name: Deploy

# Fires after CI passes on main/master. Render and Vercel each expose a
# "deploy hook" URL; storing them as repo secrets lets a push deploy both
# without relying on the dashboards' own git integrations.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API to Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set; skipping Render deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" && echo "Render deploy triggered."

      - name: Deploy UI to Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not set; skipping Vercel deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" && echo "Vercel deploy triggered."
